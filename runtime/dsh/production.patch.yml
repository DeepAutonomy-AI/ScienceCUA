# Applied after the shipped sdk-minimal profile. Business tools are inserted by
# the T4 capability proxy. Stage-specific tool surfaces are layered separately.
- insert:
    # Minimal services required for configurable OpenAI-compatible providers
    # and durable SDK image admission. All are shipped in the pinned wheel.
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
    # sdk-minimal does not mount DSH's conversation compaction services.
    # Start before the native 80% threshold to leave room for large tool results.
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        auto: true
        thresholdRatio: 0.7
