[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-to-skill-dsh"
version = "0.2.0"
description = "PDF/HTML to auditable Skills, migrated to DeepSeek Harness"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "html5lib==1.1",
  "cssselect2==0.10.1",
  "tinycss2==1.5.1",
  "deepseek-harness-sdk==0.1.2rc1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pymupdf>=1.24",
  "pypdf>=6.10,<7",
  "python-multipart>=0.0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "openpyxl>=3.1,<4",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
  "integration: starts the native SDK, extraction subprocesses, or a complete multi-stage pipeline; run explicitly when those paths change",
]
